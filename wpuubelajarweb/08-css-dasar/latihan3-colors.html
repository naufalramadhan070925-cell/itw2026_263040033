<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote galau</title>
</head>
<style>
    body {
        font-family:'Courier New', Courier, monospace;
        font-weight: bold;
        color:rgb(240, 227, 227);
        text-align: center;
        background-color: rgb(75, 69, 69);
    }

    h1 {
      font-size: 50px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(92, 89, 89);
      text-shadow: 5px 5px 0 rgb(131, 121, 121);
    }

    .quote {
        font-size: 25 px;
        line-height: 2.2;
        word-spacing: 5px;
    }

    .span {
        color: crimson;
        text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(219 205 205/70%);
      font-weight: normal;
    }

</style>


<body>

    <h1>Gemilang</h1>

    <p class="quote">Karena ini yang kumau<br>
    Berkat kepala yang <span class="span">batu</span><br>
    Semua yang ragukan atau tak percaya<br>
    Debu pagi kujelang</p>

    <p class="credit">-Perunggu</p>
    
</body>
</html>
