<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Background</title>
  <style>
    body {
      background-color: lightblue;
      background-image: linear-gradient(to right top, grey, white, lightblue, black );
      height : 100vh;
    }

    .kotak1 {
      width: 200px;
      height: 200px;
      background-color: grey;
      background-image: linear-gradient(to bottom right, pink, white, lightblue, black );
    }
    .kotak2 {
      width: 200px;
      height: 200px;
      background-color: grey;
      background-image: radial-gradient(purple, white, lightblue, black);
    }
    .kotak3 {
      width: 200px;
      height: 200px;
      background-color: grey;
      background-image:conic-gradient( blue, yellow, green);
    }
  </style>
</head>

<body>
  <div class="kotak1"></div>
  <div class="kotak2"></div>
  <div class="kotak3"></div>
</body>

</html>
