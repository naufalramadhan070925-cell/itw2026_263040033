<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote galau</title>
</head>
<style>
    body {
        font-family:'Courier New', Courier, monospace;
        font-weight: bold;
        color:rgb(240, 227, 227);
        text-align: center;
        background-color: rgb(75, 69, 69);
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://fastly.picsum.photos/id/1048/1000/1000.jpg?hmac=lnJJegbiTivJmeOu5t9OweCS7TQEr2l7H1Cnfwwngo8');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
    }

    h1 {
      font-size: 4em;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration-style: wavy;
      text-decoration-color: rgb(92, 89, 89);
      /* text-shadow: 5px 5px 0 rgb(131, 121, 121); */
      background-image: linear-gradient(to right, rgba(151, 131, 100, 0.5), rgb(221, 210, 210));
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 10px rgba(124, 63, 63, 0.5));
    }

    .quote {
        font-size: 25 px;
        line-height: 2.2;
        word-spacing: 5px;
        background-color: rgba(0, 0, 0, 0.5);
        max-width: 600px;
        margin: 0 auto;
        padding: 40px;
        border-radius: 10px;
        border: 1px solid rgba(151, 131, 100, 0.5);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 50%);
    }

    .span {
        color: crimson;
        text-decoration: none;
        text-shadow: 0 0 10px rgba(220, 63, 63, 100%);
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(219 205 205/70%);
      font-weight: normal;
      text-transform: uppercase;
      border-top: 1px solid rgba(151, 131, 100, 0.5);
      width: 100px;
      margin: 20px auto 0;
      padding-top: 10px;
    }

</style>


<body>

    <h1>Gemilang</h1>

    <p class="quote">Karena ini yang kumau<br>
    Berkat kepala yang <span class="span">batu</span><br>
    Semua yang ragukan atau tak percaya<br>
    Debu pagi kujelang</p>

    <p class="credit">-Perunggu</p>
    
</body>
</html>
